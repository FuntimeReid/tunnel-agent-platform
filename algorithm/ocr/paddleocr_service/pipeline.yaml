pipeline_name: PaddleOCR-VL
batch_size: 1
use_queues: false
use_doc_preprocessor: false
use_layout_detection: true
use_chart_recognition: false
format_block_content: true
merge_layout_blocks: false
markdown_ignore_labels:
  - number
  - footnote
  - header
  - header_image
  - footer
  - footer_image
  - aside_text

SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayoutV2
    batch_size: 1
    threshold:
      0: 0.5
      1: 0.5
      2: 0.5
      3: 0.5
      4: 0.5
      5: 0.4
      6: 0.4
      7: 0.5
      8: 0.5
      9: 0.5
      10: 0.5
      11: 0.5
      12: 0.5
      13: 0.5
      14: 0.5
      15: 0.4
      16: 0.5
      17: 0.4
      18: 0.5
      19: 0.5
      20: 0.45
      21: 0.5
      22: 0.4
      23: 0.4
      24: 0.5
    layout_nms: true
    layout_unclip_ratio: [1.0, 1.0]
    layout_merge_bboxes_mode:
      0: union
      1: union
      2: union
      3: large
      4: union
      5: large
      6: large
      7: union
      8: union
      9: union
      10: union
      11: union
      12: union
      13: union
      14: union
      15: large
      16: union
      17: large
      18: union
      19: union
      20: union
      21: union
      22: union
      23: union
      24: union
  VLRecognition:
    module_name: vl_recognition
    model_name: PaddleOCR-VL-0.9B
    batch_size: 1
    genai_config:
      backend: native

Serving:
  visualize: false
  extra:
    max_num_input_imgs: 100
